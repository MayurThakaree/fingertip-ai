[package]
name = "fingertip-ai"
version = "0.1.0"
description = "Cursor-activated desktop AI assistant"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 2: AI provider abstraction + Gemini streaming.
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"], default-features = false }
futures-util = "0.3"
async-trait = "0.1"
thiserror = "1"
# Reads AI_API_KEY / AI_PROVIDER / AI_MODEL from .env without ever passing
# through the frontend — see src/main.rs and src/ai/mod.rs.
dotenvy = "0.15"

# Low-level Win32 access for the global mouse hook (WH_MOUSE_LL),
# cursor position (GetCursorPos), and monitor work-area queries
# (MonitorFromPoint / GetMonitorInfoW) used for edge-clamping the popup.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
] }
# Reads/writes the clipboard for the "grab currently selected text"
# feature — see src-tauri/src/selection.rs. Cross-platform crate, but only
# used on the windows target here.
arboard = "3"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"

[[bin]]
name = "fingertip-ai"
path = "src/main.rs"
